name: Ro-Lang Android Build

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      run_spotless_apply:
        description: "Jalankan spotlessApply sebelum build (hanya untuk workflow_dispatch)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rolang-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Ro-Lang APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Override the default, which includes the removed legacy tools package.
          packages: 'platform-tools'

      - name: Install Android SDK Components
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Validate Corpus
        run: python3 tools/build_corpus.py

      - name: Grant Gradle Permission
        run: chmod +x gradlew

      - name: Apply Spotless Formatting (Manual Dispatch Only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_spotless_apply
        run: ./gradlew --no-daemon --stacktrace spotlessApply

      - name: Spotless Check, Unit Test, and Lint
        run: |
          ./gradlew --no-daemon --stacktrace \
            spotlessCheck \
            :app:testDebugUnitTest \
            :app:lintDebug

      - name: Build Debug & AndroidTest APKs
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest

      - name: Setup Release Keystore (If Secrets Available)
        env:
          ENCODED_STRING: ${{ secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ENCODED_STRING" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$ENCODED_STRING" | base64 -d > keystore.jks
            {
              echo "storeFile=keystore.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "Release keystore configured."
          else
            echo "Signing secrets not available; building release without custom keystore."
          fi

      - name: Build Release APKs (Non-Debug)
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Upload Debug APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rolang-android-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APKs (Non-Debug)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rolang-android-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android Test APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rolang-android-test-apks
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Test, Lint & Spotless Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rolang-verification-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            **/build/reports/spotless/
          if-no-files-found: ignore
          retention-days: 7
