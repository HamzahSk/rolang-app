
name: Codex DB Fixer

on:
  workflow_dispatch:
  push:
    paths:
      - "prompt.md"

concurrency:
  group: codex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CODEX_CLI_VERSION: "0.166.0"
  CODEX_MAX_ATTEMPTS: "5"
  CODEX_ATTEMPT_TIMEOUT_MINUTES: "45"
  CODEX_RETRY_BASE_SECONDS: "15"
  CODEX_RETRY_MAX_SECONDS: "120"

jobs:
  codex-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      AGENTROUTER_API_KEY: ${{ secrets.AGENTROUTER_API_KEY }}
      CODEX_BASE_SHA: ${{ github.sha }}

    steps:
      - name: Initialize runner temp paths
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"
          echo "CODEX_RECOVERY_DIR=$RUNNER_TEMP/codex-recovery" >> "$GITHUB_ENV"

      # Main repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Secondary repository
      - name: Checkout rolang-server
        uses: actions/checkout@v4
        with:
          repository: HamzahSk/rolang-server
          token: ${{ secrets.ROLANG_SERVER_TOKEN }}
          ref: main
          path: rolang-server
          fetch-depth: 0
          persist-credentials: true

      # Prevent the nested repository from being included
      # in the main repository's Git operations.
      - name: Exclude secondary repository
        shell: bash
        run: |
          echo "/rolang-server/" >> .git/info/exclude

      - name: Restore Codex session cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CODEX_HOME }}
          key: codex-session-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            codex-session-${{ github.run_id }}-

      - name: Restore worktree checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          checkpoint_dir="$CODEX_HOME/recovery-checkpoint"

          if [[ -s "$checkpoint_dir/base-sha.txt" ]]; then
            checkpoint_base="$(<"$checkpoint_dir/base-sha.txt")"
            if [[ "$checkpoint_base" != "$GITHUB_SHA" ]]; then
              echo "::error::Recovery checkpoint belongs to $checkpoint_base, not $GITHUB_SHA"
              exit 1
            fi
          fi

          if [[ -s "$checkpoint_dir/worktree.patch" ]]; then
            git apply --check --binary "$checkpoint_dir/worktree.patch"
            git apply --binary "$checkpoint_dir/worktree.patch"
            echo "Restored tracked-file progress from the previous workflow attempt."
          fi

          if [[ -s "$checkpoint_dir/untracked-files.tar.gz" ]]; then
            tar -xzf "$checkpoint_dir/untracked-files.tar.gz"
            echo "Restored untracked-file progress from the previous workflow attempt."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Codex CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3; do
            if timeout 5m npm install --global "@openai/codex@$CODEX_CLI_VERSION"; then
              exit 0
            fi
            if (( attempt < 3 )); then
              sleep $((attempt * 10))
            fi
          done
          echo "::error::Unable to install Codex CLI after three attempts"
          exit 1

      - name: Configure Codex
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${AGENTROUTER_API_KEY:-}" ]]; then
            echo "::error::Repository secret AGENTROUTER_API_KEY is required"
            exit 1
          fi

          mkdir -p "$CODEX_HOME"

          cat > "$CODEX_HOME/config.toml" <<'EOF'
          model = "gpt-5.6-sol"
          model_provider = "agentrouter"

          [model_providers.agentrouter]
          name = "AgentRouter"
          base_url = "https://rocckyai.rockyyrec.workers.dev/v1"
          wire_api = "responses"
          env_key = "AGENTROUTER_API_KEY"
          request_max_retries = 6
          stream_max_retries = 10
          stream_idle_timeout_ms = 300000
          EOF

      - name: Check Codex recovery support
        shell: bash
        run: |
          set -Eeuo pipefail
          codex --version
          codex exec resume --help >/dev/null

      - name: Run Codex with session recovery
        shell: bash
        run: |
          echo "Available repositories:"
          echo "Main: $GITHUB_WORKSPACE"
          echo "Backend: $GITHUB_WORKSPACE/rolang-server"

          bash .github/scripts/run-codex-with-recovery.sh prompt.md

      # Commit backend changes independently.
      - name: Commit and push rolang-server changes
        if: always()
        shell: bash
        env:
          GH_PAT: ${{ secrets.ROLANG_SERVER_TOKEN }}
        run: |
          set -Eeuo pipefail

          cd rolang-server

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No backend changes to commit."
            exit 0
          fi

          git commit -m "chore: update rolang-server via Codex"

          git push origin HEAD:main

      - name: Collect changed files and recovery diagnostics
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$CODEX_HOME"
          git add -A

          mkdir -p output_artifact codex_diagnostics
          : > output_artifact/deleted_files.txt

          while IFS= read -r -d '' file; do
            if [[ -e "$file" || -L "$file" ]]; then
              mkdir -p "output_artifact/$(dirname "$file")"
              cp -a "$file" "output_artifact/$file"
            else
              printf '%s\n' "$file" >> output_artifact/deleted_files.txt
            fi
          done < <(git diff --cached --name-only -z)

          if [[ -d "$CODEX_RECOVERY_DIR" ]]; then
            cp -a "$CODEX_RECOVERY_DIR/." codex_diagnostics/
          fi

          if [[ -d "$CODEX_HOME/sessions" ]]; then
            mkdir -p codex_diagnostics/sessions
            cp -a "$CODEX_HOME/sessions/." codex_diagnostics/sessions/
          fi

          if [[ -d "$CODEX_HOME/recovery-checkpoint" ]]; then
            mkdir -p codex_diagnostics/recovery-checkpoint
            cp -a "$CODEX_HOME/recovery-checkpoint/." codex_diagnostics/recovery-checkpoint/
          fi

      - name: Save Codex session cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CODEX_HOME }}
          key: codex-session-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Codex changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-output-${{ github.sha }}-${{ github.run_attempt }}
          path: output_artifact/
          retention-days: 14

      - name: Upload Codex recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-recovery-${{ github.sha }}-${{ github.run_attempt }}
          path: codex_diagnostics/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build Ro-Lang APK
    needs: codex-run
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      - name: Checkout base code
        uses: actions/checkout@v4

      - name: Download AI artifact
        uses: actions/download-artifact@v4
        with:
          name: codex-output-${{ github.sha }}-${{ github.run_attempt }}
          path: ai_changes

      - name: Apply AI changes to code
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f ai_changes/deleted_files.txt ]]; then
            while IFS= read -r file; do
              [[ -n "$file" ]] && rm -f -- "$file"
            done < ai_changes/deleted_files.txt
            rm ai_changes/deleted_files.txt
          fi

          cp -a ai_changes/. ./
          rm -rf ai_changes

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Components
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Validate Corpus
        run: python3 tools/build_corpus.py

      - name: Grant Gradle Permission
        run: chmod +x gradlew

      - name: Test, Lint, and Build APKs
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$ENCODED_STRING" | base64 -d > keystore.jks

      - name: Create keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "storeFile=keystore.jks" > keystore.properties
          echo "storePassword=$STORE_PASSWORD" >> keystore.properties
          echo "keyAlias=$KEY_ALIAS" >> keystore.properties
          echo "keyPassword=$KEY_PASSWORD" >> keystore.properties

      - name: Build Signed Release APK (arm64-v8a)
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Upload Release APK (arm64-v8a)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rolang-android-release-arm64
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
